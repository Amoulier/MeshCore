name: Heltec V4 Companion BLE validation

on:
  pull_request:
    paths:
      - .github/workflows/heltec-v4-companion-validation.yml
      - .github/actions/setup-build-environment/**
      - arch/esp32/**
      - boards/heltec_v4.json
      - examples/companion_radio/**
      - merge-bin.py
      - platformio.ini
      - src/**
      - variants/heltec_v4/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/heltec-v4-companion-validation.yml
      - .github/actions/setup-build-environment/**
      - arch/esp32/**
      - boards/heltec_v4.json
      - examples/companion_radio/**
      - merge-bin.py
      - platformio.ini
      - src/**
      - variants/heltec_v4/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heltec-v4-companion-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Companion BLE
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Compile application and complete flash image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=8 HEAD)"
          build_date="$(date -u '+%d-%b-%Y')"
          firmware_version="companion-${short_sha}"
          export PLATFORMIO_BUILD_FLAGS="${PLATFORMIO_BUILD_FLAGS:-} -DFIRMWARE_BUILD_DATE='\"${build_date}\"' -DFIRMWARE_VERSION='\"${firmware_version}\"'"

          pio run -e heltec_v4_companion_radio_ble
          pio run -e heltec_v4_companion_radio_ble -t mergebin

          app=.pio/build/heltec_v4_companion_radio_ble/firmware.bin
          merged=.pio/build/heltec_v4_companion_radio_ble/firmware-merged.bin
          test -s "$app"
          test -s "$merged"

          # A complete ESP32-S3 image must contain an ESP image header at both
          # 0x0 (bootloader) and 0x10000 (application). These assertions prevent
          # publishing an application-only image as a complete image.
          test "$(od -An -tx1 -N1 "$merged" | tr -d ' ')" = "e9"
          test "$(od -An -tx1 -j65536 -N1 "$merged" | tr -d ' ')" = "e9"

      - name: Create installation package
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=8 HEAD)"
          package="meshcore-heltec-v4-companion-ble-${short_sha}"
          mkdir -p out

          cp .pio/build/heltec_v4_companion_radio_ble/firmware.bin \
            "out/${package}-ota.bin"
          cp .pio/build/heltec_v4_companion_radio_ble/firmware-merged.bin \
            "out/${package}-merged.bin"

          (
            cd out
            sha256sum "${package}-ota.bin" "${package}-merged.bin" > SHA256SUMS.txt
          )

          cat > out/INSTALL.txt <<EOF
          MeshCore Heltec V4 Companion BLE validation firmware
          ====================================================

          Commit: ${GITHUB_SHA}
          Target: heltec_v4_companion_radio_ble
          Hardware: Heltec WiFi LoRa 32 V4 OLED / V4.3 OLED

          ${package}-merged.bin
            Complete fresh-install image for ESP32-S3. Flash at address 0x0.
            Keep the exact -merged.bin suffix. The MeshCore Custom Firmware
            flasher uses this suffix to select address 0x0. Renaming a complete
            image to another suffix can make the flasher write it at 0x10000 and
            cause a boot loop.

          ${package}-ota.bin
            Application-only image for a compatible MeshCore OTA/update path.
            Do not flash this file at address 0x0 as a fresh installation.

          Bluetooth pairing
          -----------------
          On an OLED Companion with the default BLE configuration, MeshCore
          generates the active six-digit PIN at boot and shows it on the OLED.
          Enter the displayed PIN; 123456 is not the active session PIN unless
          it was explicitly saved as a permanent PIN.

          On-device OLED control
          ----------------------
          Short-press PRG to reach the OLED: ON page. Hold PRG for about one
          second, then release when prompted to save the persistent OFF state.
          Hold PRG for about one second at any time to restore the OLED.
          Bluetooth and LoRa remain active while the OLED is disabled.

          Validation warning
          ------------------
          This is a prerelease candidate. Physical RF-power, current-consumption,
          prolonged BLE reconnection and identity-persistence validation remains
          required before production or unattended deployment.
          EOF

      - name: Upload Companion BLE package
        uses: actions/upload-artifact@v7
        with:
          name: heltec-v4-companion-ble-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish Companion BLE prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download Companion BLE package
        uses: actions/download-artifact@v8
        with:
          name: heltec-v4-companion-ble-${{ github.sha }}
          path: out

      - name: Publish commit-specific prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="heltec-v4-companion-validation-${short_sha}"
          title="Heltec V4 Companion BLE validation ${short_sha}"

          cat > release-notes.md <<EOF
          ## Heltec V4 Companion BLE validation candidate

          This prerelease contains the Companion BLE firmware built from commit
          \`${GITHUB_SHA}\` for the Heltec WiFi LoRa 32 V4 OLED family.

          ### Files

          - \`*-merged.bin\`: complete ESP32-S3 image. Keep this exact suffix so
            the MeshCore Custom Firmware flasher selects address \`0x0\`.
          - \`*-ota.bin\`: application-only image for a compatible MeshCore update path.
          - \`SHA256SUMS.txt\`: integrity checksums.
          - \`INSTALL.txt\`: installation, pairing, recovery and OLED-control notes.

          ### Critical flashing rule

          Do not rename the complete image to \`*-factory.bin\`. The current
          MeshCore Custom Firmware flasher recognizes a complete image by the
          exact \`-merged.bin\` suffix. A different suffix is treated as an
          application image and may be written at \`0x10000\`, causing a boot loop.

          ### Bluetooth PIN

          With the default OLED Companion configuration, the active six-digit
          BLE PIN is generated at boot and shown on the screen. Use that displayed
          PIN. The value \`123456\` is not the active session PIN unless it was
          explicitly saved as a permanent PIN.

          ### OLED control from the node

          Navigate with short PRG presses to \`OLED: ON\`, hold PRG for about one
          second, and release when prompted. The persistent setting survives a
          reboot. Hold PRG again for about one second to restore the display.
          Bluetooth and LoRa continue operating while the OLED is disabled.

          This remains validation firmware and still requires physical RF,
          current-consumption, BLE longevity and persistence testing before a
          stable production release.
          EOF

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "${tag}" out/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${tag}" out/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Retract incorrectly named 5ce832a5 complete image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_tag="heltec-v4-companion-validation-5ce832a5"
          old_asset="meshcore-heltec-v4-companion-ble-5ce832a5-factory.bin"
          if gh release view "$old_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$old_tag" "$old_asset" \
              --repo "$GITHUB_REPOSITORY" --yes || true
            cat > retracted-notes.md <<'EOF'
          # RETRACTED: do not use Custom Firmware with the removed factory asset

          The complete image in this release was correctly built but incorrectly
          named with a `-factory.bin` suffix. The MeshCore Custom Firmware flasher
          only selects address `0x0` for files ending in `-merged.bin`; therefore,
          it could write that complete image at `0x10000` and cause a boot loop.

          Use a newer release containing a file whose name ends exactly in
          `-merged.bin`. The application-only OTA asset remains for compatible OTA
          paths, but this release is retained only as an incident record.
          EOF
            gh release edit "$old_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RETRACTED — Heltec V4 Companion BLE 5ce832a5" \
              --notes-file retracted-notes.md \
              --prerelease
          fi
