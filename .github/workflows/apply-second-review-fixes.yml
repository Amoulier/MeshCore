name: Apply second review fixes

on:
  push:
    branches:
      - feature/heltec-v4-power-parity
    paths:
      - .github/workflows/apply-second-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/heltec-v4-power-parity
          fetch-depth: 0

      - name: Harden identity verification and migrate legacy LNA state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          identity_path = Path("src/helpers/IdentityStore.cpp")
          identity = identity_path.read_text(encoding="utf-8")
          identity_start = identity.index("  mesh::LocalIdentity verified;\n")
          identity_end = identity.index("\n\n  fs->remove(backup_path);", identity_start)
          identity_replacement = (
              "  mesh::LocalIdentity verified;\n"
              "  bool key_pair_verified = loadIdentityFile(fs, temporary_path, verified) && verified.matches(id);\n"
              "  if (key_pair_verified) {\n"
              "    static const uint8_t verification_message[] = {\n"
              "      'M', 'e', 's', 'h', 'C', 'o', 'r', 'e', '-', 'i', 'd', 'e', 'n', 't', 'i', 't', 'y'\n"
              "    };\n"
              "    uint8_t verification_signature[SIGNATURE_SIZE] = {};\n"
              "    verified.sign(verification_signature, verification_message, sizeof(verification_message));\n"
              "    key_pair_verified = verified.verify(verification_signature, verification_message,\n"
              "                                        sizeof(verification_message));\n"
              "  }\n"
              "  if (!key_pair_verified || !meshcorePersistentWritesAllowed()) {\n"
              "    fs->remove(temporary_path);\n"
              "    return false;\n"
              "  }"
          )
          identity = identity[:identity_start] + identity_replacement + identity[identity_end:]
          identity_path.write_text(identity, encoding="utf-8")

          board_path = Path("variants/heltec_v4/HeltecV4Board.cpp")
          board = board_path.read_text(encoding="utf-8")

          old_state = "RTC_DATA_ATTR bool battery_critical_latched = false;\nvolatile bool persistent_writes_allowed = true;\n"
          new_state = old_state + "bool fem_lna_nvs_explicit = false;\n"
          if board.count(old_state) != 1:
              raise SystemExit("Expected board state block was not found exactly once")
          board = board.replace(old_state, new_state)

          namespace_marker = "\n} // namespace\n\nbool meshcorePersistentWritesAllowed()"
          if board.count(namespace_marker) != 1:
              raise SystemExit("Expected anonymous-namespace marker was not found exactly once")
          helper = (
              "\nbool persistFemLnaPreference(bool enabled)\n"
              "{\n"
              "  if (!meshcorePersistentWritesAllowed()) {\n"
              "    return false;\n"
              "  }\n\n"
              "  Preferences preferences;\n"
              "  if (!preferences.begin(BOARD_PREFS_NAMESPACE, false)) {\n"
              "    return false;\n"
              "  }\n"
              "  // The explicit marker is the commit record: write the value first so\n"
              "  // an interrupted migration is retried rather than accepting a default.\n"
              "  const bool value_written = preferences.putBool(FEM_LNA_ENABLED_KEY, enabled) == sizeof(bool);\n"
              "  const bool marker_written = value_written &&\n"
              "                              preferences.putBool(FEM_LNA_EXPLICIT_KEY, true) == sizeof(bool);\n"
              "  preferences.end();\n"
              "  return marker_written;\n"
              "}\n"
          )
          board = board.replace(namespace_marker, helper + namespace_marker)

          begin_start = board.index("  loRaFEMControl.init();\n")
          begin_end = board.index("\n\n  periph_power.begin();", begin_start)
          begin_replacement = (
              "  loRaFEMControl.init();\n"
              "  bool enable_lna = true;\n"
              "  fem_lna_nvs_explicit = false;\n"
              "  Preferences preferences;\n"
              "  if (preferences.begin(BOARD_PREFS_NAMESPACE, true)) {\n"
              "    fem_lna_nvs_explicit = preferences.getBool(FEM_LNA_EXPLICIT_KEY, false);\n"
              "    if (fem_lna_nvs_explicit) {\n"
              "      enable_lna = preferences.getBool(FEM_LNA_ENABLED_KEY, true);\n"
              "    }\n"
              "    preferences.end();\n"
              "  }\n"
              "  setLoRaFemLnaEnabled(enable_lna);"
          )
          board = board[:begin_start] + begin_replacement + board[begin_end:]

          attach_start = board.index("void HeltecV4Board::attachDynamicPrefs(KeyValueStore *prefs)\n")
          attach_end = board.index("\nbool HeltecV4Board::handleCommand", attach_start)
          attach_replacement = (
              "void HeltecV4Board::attachDynamicPrefs(KeyValueStore *prefs)\n"
              "{\n"
              "  _prefs = prefs;\n"
              "  if (!_prefs || !loRaFEMControl.isLnaCanControl()) {\n"
              "    return;\n"
              "  }\n\n"
              "  if (fem_lna_nvs_explicit) {\n"
              "    // Once migrated, NVS is authoritative and keeps the JSON preference\n"
              "    // aligned for clients that still inspect the legacy field.\n"
              "    _prefs->setByKey(\"fem_rxgain\", isLoRaFemLnaEnabled() ? \"1\" : \"0\");\n"
              "    return;\n"
              "  }\n\n"
              "  char legacy_fem_rxgain[8] = {};\n"
              "  if (!_prefs->getByKey(\"fem_rxgain\", legacy_fem_rxgain, sizeof(legacy_fem_rxgain))) {\n"
              "    return;\n"
              "  }\n\n"
              "  // Fresh installs default this field to 1; upgraded installations can\n"
              "  // carry an explicit 0. Apply it before creating the new NVS marker.\n"
              "  const bool enable_lna = strcmp(legacy_fem_rxgain, \"1\") == 0;\n"
              "  setLoRaFemLnaEnabled(enable_lna);\n"
              "  fem_lna_nvs_explicit = persistFemLnaPreference(enable_lna);\n"
              "}\n"
          )
          board = board[:attach_start] + attach_replacement + board[attach_end:]

          command_start = board.index("  if (memcmp(command, \"set radio.fem.rxgain \", 21) == 0) {\n")
          persistence_start = board.index("    if (meshcorePersistentWritesAllowed()) {\n", command_start)
          persistence_end = board.index("\n    strcpy(reply", persistence_start)
          persistence_replacement = (
              "    fem_lna_nvs_explicit = persistFemLnaPreference(enable) || fem_lna_nvs_explicit;"
          )
          board = board[:persistence_start] + persistence_replacement + board[persistence_end:]
          board_path.write_text(board, encoding="utf-8")
          PY

          rm .github/workflows/apply-second-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/helpers/IdentityStore.cpp variants/heltec_v4/HeltecV4Board.cpp .github/workflows/apply-second-review-fixes.yml
          git commit -m "fix(heltec-v4): address identity and LNA migration review"
          git push origin HEAD:feature/heltec-v4-power-parity
