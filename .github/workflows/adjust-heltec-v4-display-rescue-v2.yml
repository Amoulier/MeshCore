name: Adjust Heltec V4 OLED menu rescue handling v2

on:
  push:
    branches:
      - feature/heltec-v4-on-device-display-control
    paths:
      - .github/workflows/adjust-heltec-v4-display-rescue-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Keep OLED menu action available during startup window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("examples/companion_radio/ui-new/UITask.cpp")
          text = path.read_text(encoding="utf-8")

          old_method = "  bool handleInput(char c) override {\n    if (c == KEY_LEFT || c == KEY_PREV) {"
          new_method = "  bool isDisplayPage() const { return _page == HomePage::DISPLAY; }\n\n  bool handleInput(char c) override {\n    if (c == KEY_LEFT || c == KEY_PREV) {"

          old_handler = "char UITask::handleLongPress(char c) {\n  if (millis() - ui_started_at < 8000) {   // long press in first 8 seconds since startup -> CLI/rescue\n    the_mesh.enterCLIRescue();\n    c = 0;   // consume event\n  }\n  return c;\n}"
          new_handler = "char UITask::handleLongPress(char c) {\n  const bool display_menu_action = curr == home &&\n      static_cast<HomeScreen *>(home)->isDisplayPage();\n  if (millis() - ui_started_at < 8000 && !display_menu_action) {\n    // Preserve the startup CLI/rescue gesture everywhere except the explicit\n    // OLED menu, where the selected local action takes precedence.\n    the_mesh.enterCLIRescue();\n    c = 0;\n  }\n  return c;\n}"

          if new_method not in text:
              if text.count(old_method) != 1:
                  raise RuntimeError(f"HomeScreen method anchor count: {text.count(old_method)}")
              text = text.replace(old_method, new_method, 1)
          if new_handler not in text:
              if text.count(old_handler) != 1:
                  raise RuntimeError(f"Long-press anchor count: {text.count(old_handler)}")
              text = text.replace(old_handler, new_handler, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'bool isDisplayPage() const' examples/companion_radio/ui-new/UITask.cpp)" -eq 1
          test "$(grep -c 'millis() - ui_started_at < 8000 && !display_menu_action' examples/companion_radio/ui-new/UITask.cpp)" -eq 1

      - name: Commit focused change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/ui-new/UITask.cpp
          git commit -m "fix(heltec-v4): prioritize OLED menu over startup rescue"
          git push
