name: Issue Triggered Heltec V4 v1.1.1 Release

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: heltec-v4-v1-1-1-issue-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.issue.title == '[release] heltec-v4-energy-v1.1.1'
    name: Package ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - heltec_v4_solar_repeater
          - heltec_v4_expansionkit_repeater
          - heltec_v4_repeater_bridge_espnow
          - heltec_v4_room_server
          - heltec_v4_terminal_chat
          - heltec_v4_companion_radio_usb
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_wifi
          - heltec_v4_sensor
          - heltec_v4_kiss_modem

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify BLE battery and maximum-TX invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < .github/release/heltec-v4-energy-version.txt)" = 'heltec-v4-energy-v1.1.1'
          grep -Fq 'BLEDevice::deinit(false)' src/helpers/esp32/SerialBLEInterface.cpp
          grep -Fq 'isFullyPoweredDown()' src/helpers/esp32/SerialBLEInterface.h
          grep -Fq 'board.sleep(1)' examples/companion_radio/main.cpp
          grep -Fq 'buttonWakeupPin' src/helpers/ESP32Board.h
          grep -Fq -- '-D LORA_TX_POWER=22' variants/heltec_v4/platformio.ini
          grep -Fq -- '-D HELTEC_V4_FORCE_MAX_TX=1' variants/heltec_v4/platformio.ini
          grep -Fq 'dbm = MAX_LORA_TX_POWER;' src/helpers/radiolib/RadioLibWrappers.cpp
          grep -Fq -- '-D MAX_LORA_TX_POWER=22' variants/heltec_v4/platformio.ini

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build and validate installable images
        shell: bash
        env:
          TARGET: ${{ matrix.environment }}
          RELEASE_TAG: heltec-v4-energy-v1.1.1
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=8 HEAD)"
          build_date="$(date -u '+%d-%b-%Y')"
          firmware_version="${RELEASE_TAG}-${short_sha}"
          export PLATFORMIO_BUILD_FLAGS="${PLATFORMIO_BUILD_FLAGS:-} -DFIRMWARE_BUILD_DATE='\"${build_date}\"' -DFIRMWARE_VERSION='\"${firmware_version}\"'"
          pio run -e "${TARGET}"
          pio run -e "${TARGET}" -t mergebin
          app_source=".pio/build/${TARGET}/firmware.bin"
          merged_source=".pio/build/${TARGET}/firmware-merged.bin"
          python - "${app_source}" "${merged_source}" <<'PY'
          from pathlib import Path
          import sys
          app = Path(sys.argv[1]).read_bytes()
          merged = Path(sys.argv[2]).read_bytes()
          assert app and app[0] == 0xE9
          assert merged and merged[0] == 0xE9
          assert len(merged) > 0x10000 and merged[0x10000] == 0xE9
          PY
          mkdir -p out
          base="${TARGET}-${RELEASE_TAG}-${short_sha}"
          cp "${app_source}" "out/${base}-ota.bin"
          cp "${merged_source}" "out/${base}-merged.bin"

      - name: Upload firmware pair
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.environment }}
          path: |
            out/*-merged.bin
            out/*-ota.bin
          if-no-files-found: error

  release:
    if: github.event.issue.title == '[release] heltec-v4-energy-v1.1.1'
    name: Publish Heltec V4 v1.1.1
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download all firmware pairs
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Verify inventory and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find out -maxdepth 1 -type f -name '*-ota.bin' | wc -l)" -eq 10
          test "$(find out -maxdepth 1 -type f -name '*-merged.bin' | wc -l)" -eq 10
          cat > out/INSTALLATION.txt <<'EOF'
          MeshCore Heltec V4 Energy Optimization v1.1.1

          *-merged.bin: complete ESP32-S3 image for a fresh installation or
          recovery at address 0x0. Keep the exact -merged.bin suffix.

          *-ota.bin: application-only image for a compatible MeshCore update.
          Never flash an OTA image at address 0x0.

          Companion BLE fully powers Bluetooth down after five disconnected
          minutes, then light-sleeps while LoRa remains in continuous RX.
          Restore BLE from the Bluetooth page with a long PRG press.

          TX remains locked to the FEM-aware maximum estimated 22 dBm antenna
          path: 11 dBm SX1262 input on GC1109 and 9 dBm on KCT8103L.
          EOF
          archive="MeshCore-Heltec-V4-all-variants-heltec-v4-energy-v1.1.1.zip"
          (
            cd out
            zip -9 "${archive}" ./*-merged.bin ./*-ota.bin INSTALLATION.txt
            sha256sum ./*-merged.bin ./*-ota.bin "${archive}" > SHA256SUMS.txt
          )

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: heltec-v4-energy-v1.1.1
          target_commitish: main
          name: MeshCore Heltec V4 Energy Optimization v1.1.1
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Heltec V4 OLED-only battery-runtime hotfix and maximum-TX release.

            **Battery fix:** after five disconnected minutes, Companion BLE fully
            deinitializes Bluedroid and the ESP32-S3 Bluetooth controller. The MCU
            then enters explicit light sleep whenever the mesh is idle, while the
            SX1262 stays in continuous RX and wakes through DIO1. PRG and a
            one-second maintenance timer are additional wake sources.

            **TX policy:** all ten firmware roles remain locked at the existing
            FEM-aware maximum estimated 22 dBm antenna-path ceiling. GC1109 applies
            11 dBm to the SX1262; KCT8103L applies 9 dBm. Lower saved values or
            client commands cannot reduce physical TX power.

            ### Companion
            - `heltec_v4_companion_radio_ble` — BLE phone Companion with full BLE-off light sleep after five disconnected minutes.
            - `heltec_v4_companion_radio_usb` — Companion over USB serial.
            - `heltec_v4_companion_radio_wifi` — Companion over Wi-Fi/TCP with modem power saving and reconnect backoff.

            ### Repeaters and infrastructure
            - `heltec_v4_solar_repeater` — Solar repeater with critical-battery recovery and default power saving.
            - `heltec_v4_expansionkit_repeater` — Repeater with expansion-kit sensors and accessory bus.
            - `heltec_v4_repeater_bridge_espnow` — Continuously available LoRa/ESP-NOW bridge.

            ### Services and endpoints
            - `heltec_v4_room_server` — Shared room/BBS service.
            - `heltec_v4_terminal_chat` — USB serial terminal chat client.
            - `heltec_v4_sensor` — Always-on telemetry and alert node.
            - `heltec_v4_kiss_modem` — USB KISS modem for external software.

            This is a prerelease because current draw, complete battery runtime and
            conducted RF power still require physical measurement on V4.2/GC1109
            and V4.3/KCT8103L hardware.
          files: |
            out/*-merged.bin
            out/*-ota.bin
            out/MeshCore-Heltec-V4-all-variants-*.zip
            out/INSTALLATION.txt
            out/SHA256SUMS.txt

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed
