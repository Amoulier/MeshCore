name: Cleanup obsolete Heltec V4 releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-obsolete-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete obsolete releases and tags
    runs-on: ubuntu-latest
    steps:
      - name: Remove unsafe or superseded releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          obsolete_tags=(
            heltec-v4-companion-validation-e5e578b5
            heltec-v4-companion-validation-5ce832a5
          )

          for tag in "${obsolete_tags[@]}"; do
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.id' 2>/dev/null || true)"
            if [[ -n "${release_id}" ]]; then
              echo "Deleting release ${tag} (${release_id})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            else
              echo "Release ${tag} is already absent"
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Deleting tag ${tag}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            else
              echo "Tag ${tag} is already absent"
            fi
          done

          for tag in "${obsolete_tags[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "Release still exists: ${tag}" >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag still exists: ${tag}" >&2
              exit 1
            fi
          done

          echo "Obsolete releases and tags removed successfully."
