name: Schedule Heltec V4 v1.1.1 Release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: heltec-v4-energy-v1.1.1
    steps:
      - name: Dispatch only while v1.1.1 is absent
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; no dispatch required."
            exit 0
          fi
          gh workflow run heltec-v4-validation-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
