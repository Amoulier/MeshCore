name: Fix Heltec V4 OLED auto-off wake

on:
  push:
    branches:
      - feature/heltec-v4-on-device-display-control
    paths:
      - .github/workflows/fix-heltec-v4-oled-autooff-wake.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Wake a timed-out OLED before accepting the menu action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/companion_radio/ui-new/UITask.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''    if (c == KEY_ENTER && _page == HomePage::OLED_CONTROL) {
      if (heltecV4GetDisplayDisabled() < 0) {
        _task->showAlert("Display unsupported", 1000);
      } else {
        _display_off_init = true;
        _task->showAlert("Release to turn off", 800);
      }
      return true;
    }'''
          new = '''    if (c == KEY_ENTER && _page == HomePage::OLED_CONTROL) {
      const int8_t persistent_disabled = heltecV4GetDisplayDisabled();
      if (persistent_disabled < 0) {
        _task->showAlert("Display unsupported", 1000);
      } else if (!display.isOn()) {
        // A long press does not pass through checkDisplayOn(). If the normal
        // inactivity timer blanked the OLED, consume this action by waking it
        // instead of confirming a persistent shutdown on an unseen page.
        if (persistent_disabled) {
          heltecV4SetDisplayEnabled(true);
        } else {
          display.turnOn();
        }
        _task->showAlert(display.isOn() ? "Display on" : "Display wake failed", 1000);
      } else {
        _display_off_init = true;
        _task->showAlert("Release to turn off", 800);
      }
      return true;
    }'''

          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one OLED action block, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'else if (!display.isOn())' examples/companion_radio/ui-new/UITask.cpp)" -eq 1
          grep -q 'instead of confirming a persistent shutdown on an unseen page' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'display.isOn() ? "Display on" : "Display wake failed"' examples/companion_radio/ui-new/UITask.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/ui-new/UITask.cpp
          git commit -m "fix(heltec-v4): wake timed-out OLED before menu action"
          git push
