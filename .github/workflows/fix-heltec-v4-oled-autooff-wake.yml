name: Fix Heltec V4 OLED auto-off wake

on:
  push:
    branches:
      - feature/heltec-v4-on-device-display-control
    paths:
      - .github/workflows/fix-heltec-v4-oled-autooff-wake.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Wake a timed-out OLED before accepting the menu action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/companion_radio/ui-new/UITask.cpp")
          text = path.read_text(encoding="utf-8")
          old = "    if (c == KEY_ENTER && _page == HomePage::OLED_CONTROL) {\n      if (heltecV4GetDisplayDisabled() < 0) {\n        _task->showAlert(\"Display unsupported\", 1000);\n      } else {\n        _display_off_init = true;\n        _task->showAlert(\"Release to turn off\", 800);\n      }\n      return true;\n    }"
          new = "    if (c == KEY_ENTER && _page == HomePage::OLED_CONTROL) {\n      const int8_t persistent_disabled = heltecV4GetDisplayDisabled();\n      if (persistent_disabled < 0) {\n        _task->showAlert(\"Display unsupported\", 1000);\n      } else if (!display.isOn()) {\n        // A long press does not pass through checkDisplayOn(). If the normal\n        // inactivity timer blanked the OLED, consume this action by waking it\n        // instead of confirming a persistent shutdown on an unseen page.\n        if (persistent_disabled) {\n          heltecV4SetDisplayEnabled(true);\n        } else {\n          display.turnOn();\n        }\n        _task->showAlert(display.isOn() ? \"Display on\" : \"Display wake failed\", 1000);\n      } else {\n        _display_off_init = true;\n        _task->showAlert(\"Release to turn off\", 800);\n      }\n      return true;\n    }"

          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one OLED action block, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'else if (!display.isOn())' examples/companion_radio/ui-new/UITask.cpp)" -eq 1
          grep -q 'instead of confirming a persistent shutdown on an unseen page' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'Display wake failed' examples/companion_radio/ui-new/UITask.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/ui-new/UITask.cpp
          git commit -m "fix(heltec-v4): wake timed-out OLED before menu action"
          git push