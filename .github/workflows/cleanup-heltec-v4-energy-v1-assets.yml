name: Cleanup Heltec V4 Energy v1.0.0 Assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-heltec-v4-energy-v1-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: heltec-v4-energy-v1.0.0
    steps:
      - name: Download the files that must remain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir package \
            --pattern '*-merged.bin' \
            --pattern '*-ota.bin' \
            --pattern 'INSTALLATION.txt'

          test "$(find package -maxdepth 1 -type f -name '*-merged.bin' | wc -l)" -eq 16
          test "$(find package -maxdepth 1 -type f -name '*-ota.bin' | wc -l)" -eq 16
          test -s package/INSTALLATION.txt

      - name: Remove repeated and auxiliary release assets
        shell: bash
        run: |
          set -euo pipefail

          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | [.id, .name] | @tsv' > assets.tsv

          removed=0
          kept=0
          while IFS=$'\t' read -r asset_id asset_name; do
            case "${asset_name}" in
              *-merged.bin|*-ota.bin|INSTALLATION.txt)
                echo "Keeping ${asset_name}"
                kept=$((kept + 1))
                ;;
              *)
                echo "Removing ${asset_name}"
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                removed=$((removed + 1))
                ;;
            esac
          done < assets.tsv

          echo "Kept ${kept} existing assets and removed ${removed} redundant assets."
          test "${kept}" -eq 33

      - name: Create one clean ZIP and one checksum file
        shell: bash
        run: |
          set -euo pipefail

          archive="MeshCore-Heltec-V4-all-variants-${RELEASE_TAG}.zip"
          (
            cd package
            zip -9 "${archive}" ./*-merged.bin ./*-ota.bin INSTALLATION.txt
            sha256sum ./*-merged.bin ./*-ota.bin "${archive}" > SHA256SUMS.txt
          )

          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "package/${archive}" \
            package/SHA256SUMS.txt \
            --clobber

      - name: Update release explanation
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Heltec WiFi LoRa 32 V4 OLED-only energy-optimization prerelease.

          This release contains all 16 supported firmware variants. Each role has
          only two firmware files:

          - `*-merged.bin`: complete image for a fresh flash or recovery at `0x0`.
          - `*-ota.bin`: application image for a compatible MeshCore update path.

          `MeshCore-Heltec-V4-all-variants-heltec-v4-energy-v1.0.0.zip` contains
          all 32 firmware images plus the installation instructions. Checksums
          are centralized in the single `SHA256SUMS.txt` file. Repeated per-role
          manifests, notes and checksum files were intentionally removed.

          Main changes include cooperative ESP32 idle, cached battery telemetry,
          persistent OLED/GPS power control, staged BLE advertising, Wi-Fi modem
          sleep, optional ESP-NOW receive windows, adaptive noise calibration,
          low-power roles and the existing FEM-aware estimated 22 dBm ceiling.

          This remains a prerelease pending physical current, RF, sensitivity,
          BLE/Wi-Fi/ESP-NOW and full solar-recovery validation on V4.2/GC1109
          and V4.3/KCT8103L hardware.
          EOF

          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file release-notes.md

      - name: Verify the cleaned release inventory
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          total="$(jq '.assets | length' <<< "${release_json}")"
          merged="$(jq '[.assets[] | select(.name | endswith("-merged.bin"))] | length' <<< "${release_json}")"
          ota="$(jq '[.assets[] | select(.name | endswith("-ota.bin"))] | length' <<< "${release_json}")"
          archive="$(jq '[.assets[] | select(.name == "MeshCore-Heltec-V4-all-variants-heltec-v4-energy-v1.0.0.zip")] | length' <<< "${release_json}")"
          install="$(jq '[.assets[] | select(.name == "INSTALLATION.txt")] | length' <<< "${release_json}")"
          sums="$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' <<< "${release_json}")"

          echo "Assets: total=${total}, merged=${merged}, ota=${ota}, zip=${archive}, installation=${install}, checksums=${sums}"
          test "${total}" -eq 35
          test "${merged}" -eq 16
          test "${ota}" -eq 16
          test "${archive}" -eq 1
          test "${install}" -eq 1
          test "${sums}" -eq 1
