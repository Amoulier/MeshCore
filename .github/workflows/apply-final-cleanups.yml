name: Apply final Heltec V4 audit cleanups

on:
  push:
    branches:
      - feature/heltec-v4-power-parity
    paths:
      - .github/workflows/apply-final-cleanups.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/heltec-v4-power-parity
          fetch-depth: 0

      - name: Avoid dirtying legacy prefs during an unchanged NVS sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("variants/heltec_v4/HeltecV4Board.cpp")
          text = path.read_text(encoding="utf-8")
          start = text.index("  if (fem_lna_nvs_explicit) {\n")
          end = text.index("\n\n  char legacy_fem_rxgain", start)
          replacement = (
              "  if (fem_lna_nvs_explicit) {\n"
              "    // Once migrated, NVS is authoritative. Only touch the legacy JSON\n"
              "    // field when it actually differs, avoiding an unnecessary flash save.\n"
              "    const char *desired_fem_rxgain = isLoRaFemLnaEnabled() ? \"1\" : \"0\";\n"
              "    char stored_fem_rxgain[8] = {};\n"
              "    if (!_prefs->getByKey(\"fem_rxgain\", stored_fem_rxgain, sizeof(stored_fem_rxgain)) ||\n"
              "        strcmp(stored_fem_rxgain, desired_fem_rxgain) != 0) {\n"
              "      _prefs->setByKey(\"fem_rxgain\", desired_fem_rxgain);\n"
              "    }\n"
              "    return;\n"
              "  }"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          rm .github/workflows/apply-final-cleanups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants/heltec_v4/HeltecV4Board.cpp .github/workflows/apply-final-cleanups.yml
          git commit -m "fix(heltec-v4): avoid redundant LNA preference writes"
          git push origin HEAD:feature/heltec-v4-power-parity
