name: Trigger BLE Battery Hotfix Validation

on:
  workflow_run:
    workflows: ["Heltec V4 CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.workflow_run.id == 39696795961 && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch current-main battery validation
        run: gh workflow run validate-release-ble-battery-hotfix.yml --repo "${GITHUB_REPOSITORY}" --ref main
