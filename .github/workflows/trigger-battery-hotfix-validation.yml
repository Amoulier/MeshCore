name: Trigger BLE Battery Hotfix Validation

on:
  workflow_run:
    workflows: ["Heltec V4 CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.workflow_run.id == 33944549433
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch current-main battery and max-TX validation
        run: gh workflow run apply-ble-battery-max-tx-v1.1.1.yml --repo "${GITHUB_REPOSITORY}" --ref main
