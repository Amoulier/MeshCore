name: Apply solar radio recovery safety

on:
  push:
    branches:
      - feature/heltec-v4-power-parity
    paths:
      - .github/workflows/apply-radio-recovery-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/heltec-v4-power-parity
          fetch-depth: 0

      - name: Hold SX1262 reset only when recovery state is unknown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          header_path = Path("variants/heltec_v4/HeltecV4Board.h")
          header = header_path.read_text(encoding="utf-8")
          old = "  void enterCriticalBatterySleep(bool runtime_shutdown);\n"
          new = "  void enterCriticalBatterySleep(bool runtime_shutdown, bool force_radio_reset);\n"
          if header.count(old) != 1:
              raise SystemExit("Expected board sleep declaration not found exactly once")
          header_path.write_text(header.replace(old, new), encoding="utf-8")

          policy_path = Path("variants/heltec_v4/HeltecV4PowerPolicy.h")
          policy = policy_path.read_text(encoding="utf-8")
          anchor = "inline uint8_t updateLowReadingCounter(uint8_t current_count,\n"
          helper = (
              "constexpr bool isBatteryRecoveryRadioStateKnownSafe(bool recovery_latched, bool timer_wake)\n"
              "{\n"
              "  return recovery_latched && timer_wake;\n"
              "}\n\n"
          )
          if policy.count(anchor) != 1 or "isBatteryRecoveryRadioStateKnownSafe" in policy:
              raise SystemExit("Power-policy insertion point is invalid")
          policy_path.write_text(policy.replace(anchor, helper + anchor), encoding="utf-8")

          test_path = Path("test/test_heltec_v4_power_policy/test_heltec_v4_power_policy.cpp")
          tests = test_path.read_text(encoding="utf-8")
          test_anchor = "TEST(HeltecV4CriticalBattery, RuntimeCounterRequiresConsecutiveReadings)\n"
          test_block = (
              "TEST(HeltecV4CriticalBattery, RadioStateIsSafeOnlyOnLatchedTimerWake)\n"
              "{\n"
              "  EXPECT_TRUE(isBatteryRecoveryRadioStateKnownSafe(true, true));\n"
              "  EXPECT_FALSE(isBatteryRecoveryRadioStateKnownSafe(true, false));\n"
              "  EXPECT_FALSE(isBatteryRecoveryRadioStateKnownSafe(false, true));\n"
              "  EXPECT_FALSE(isBatteryRecoveryRadioStateKnownSafe(false, false));\n"
              "}\n\n"
          )
          if tests.count(test_anchor) != 1 or "RadioStateIsSafeOnlyOnLatchedTimerWake" in tests:
              raise SystemExit("Power-policy test insertion point is invalid")
          test_path.write_text(tests.replace(test_anchor, test_block + test_anchor), encoding="utf-8")

          board_path = Path("variants/heltec_v4/HeltecV4Board.cpp")
          board = board_path.read_text(encoding="utf-8")

          old_release = "  releasePinHoldAtLevel(P_LORA_NSS, HIGH);\n  releasePinHoldAtLevel(P_LORA_PA_POWER, LOW);\n"
          new_release = "  releasePinHoldAtLevel(P_LORA_NSS, HIGH);\n  releasePinHoldAtLevel(P_LORA_RESET, HIGH);\n  releasePinHoldAtLevel(P_LORA_PA_POWER, LOW);\n"
          if board.count(old_release) != 1:
              raise SystemExit("Expected reset-release insertion point not found exactly once")
          board = board.replace(old_release, new_release)

          old_signature = "void HeltecV4Board::enterCriticalBatterySleep(bool runtime_shutdown)\n"
          new_signature = "void HeltecV4Board::enterCriticalBatterySleep(bool runtime_shutdown, bool force_radio_reset)\n"
          if board.count(old_signature) != 1:
              raise SystemExit("Expected board sleep definition not found exactly once")
          board = board.replace(old_signature, new_signature)

          old_sleep_pins = "  configureAndHoldPin(P_LORA_NSS, HIGH);\n  configureAndHoldPin(P_LORA_GC1109_PA_TX_EN, LOW);\n"
          new_sleep_pins = (
              "  configureAndHoldPin(P_LORA_NSS, HIGH);\n"
              "  if (force_radio_reset) {\n"
              "    const gpio_num_t radio_reset = static_cast<gpio_num_t>(P_LORA_RESET);\n"
              "    gpio_pullup_dis(radio_reset);\n"
              "    gpio_pulldown_dis(radio_reset);\n"
              "    configureAndHoldPin(P_LORA_RESET, LOW);\n"
              "  }\n"
              "  configureAndHoldPin(P_LORA_GC1109_PA_TX_EN, LOW);\n"
          )
          if board.count(old_sleep_pins) != 1:
              raise SystemExit("Expected recovery pin block not found exactly once")
          board = board.replace(old_sleep_pins, new_sleep_pins)

          old_non_solar = "#else\n  (void)runtime_shutdown;\n#endif\n}\n\nvoid HeltecV4Board::begin()\n"
          new_non_solar = "#else\n  (void)runtime_shutdown;\n  (void)force_radio_reset;\n#endif\n}\n\nvoid HeltecV4Board::begin()\n"
          if board.count(old_non_solar) != 1:
              raise SystemExit("Expected non-solar sleep stub not found exactly once")
          board = board.replace(old_non_solar, new_non_solar)

          old_boot_call = "  const uint16_t boot_millivolts = readBatteryMilliVoltsRaw();\n  if (heltec_v4::shouldUseCriticalBatteryRecovery(\n"
          new_boot_call = (
              "  const bool timer_wake = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER;\n"
              "  const bool radio_state_known_safe = heltec_v4::isBatteryRecoveryRadioStateKnownSafe(\n"
              "      recovery_was_latched, timer_wake);\n"
              "  const uint16_t boot_millivolts = readBatteryMilliVoltsRaw();\n"
              "  if (heltec_v4::shouldUseCriticalBatteryRecovery(\n"
          )
          if board.count(old_boot_call) != 1:
              raise SystemExit("Expected early battery read block not found exactly once")
          board = board.replace(old_boot_call, new_boot_call)

          old_enter_boot = "    enterCriticalBatterySleep(false);\n"
          new_enter_boot = "    enterCriticalBatterySleep(false, !radio_state_known_safe);\n"
          if board.count(old_enter_boot) != 1:
              raise SystemExit("Expected early recovery call not found exactly once")
          board = board.replace(old_enter_boot, new_enter_boot)

          old_enter_runtime = "    enterCriticalBatterySleep(true);\n"
          new_enter_runtime = "    enterCriticalBatterySleep(true, false);\n"
          if board.count(old_enter_runtime) != 1:
              raise SystemExit("Expected runtime recovery call not found exactly once")
          board = board.replace(old_enter_runtime, new_enter_runtime)

          required = [
              "enterCriticalBatterySleep(bool runtime_shutdown, bool force_radio_reset)",
              "releasePinHoldAtLevel(P_LORA_RESET, HIGH);",
              "configureAndHoldPin(P_LORA_RESET, LOW);",
              "enterCriticalBatterySleep(false, !radio_state_known_safe);",
              "enterCriticalBatterySleep(true, false);",
          ]
          for token in required:
              if board.count(token) != 1:
                  raise SystemExit(f"Board post-patch sanity check failed for {token}")
          board_path.write_text(board, encoding="utf-8")
          PY

          rm .github/workflows/apply-radio-recovery-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants/heltec_v4 test/test_heltec_v4_power_policy .github/workflows/apply-radio-recovery-safety.yml
          git commit -m "fix(heltec-v4): hold radio reset during unknown low-battery recovery"
          git push origin HEAD:feature/heltec-v4-power-parity
