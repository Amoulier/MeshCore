name: Guarantee Heltec V4 local OLED control

on:
  push:
    branches:
      - fix/heltec-v4-local-display-guarantee

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix-test-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: fix/heltec-v4-local-display-guarantee
          fetch-depth: 0

      - name: Audit and apply missing local OLED controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('examples/companion_radio/ui-new/UITask.cpp')
          ui = ui_path.read_text()

          if '    DISPLAY,' not in ui:
              anchor = '    BLUETOOTH,\n    ADVERT,'
              if anchor not in ui:
                  raise SystemExit('HomePage enum anchor not found')
              ui = ui.replace(anchor, '    BLUETOOTH,\n    DISPLAY,\n    ADVERT,', 1)

          if 'else if (_page == HomePage::DISPLAY)' not in ui:
              anchor = '    } else if (_page == HomePage::ADVERT) {'
              block = '''    } else if (_page == HomePage::DISPLAY) {
            display.setColor(UIColor::primary_txt);
            display.setTextSize(2);
            display.drawTextCentered(display.width() / 2, 22, "OLED ON");
            display.setColor(UIColor::secondary_txt);
            display.setTextSize(1);
            display.drawTextCentered(display.width() / 2, 53, "turn off: " PRESS_LABEL);
          } else if (_page == HomePage::ADVERT) {'''
              if anchor not in ui:
                  raise SystemExit('Display render anchor not found')
              ui = ui.replace(anchor, block, 1)

          if 'board.handleCommand("set display off"' not in ui:
              anchor = '    if (c == KEY_ENTER && _page == HomePage::BLUETOOTH) {'
              block = '''    if (c == KEY_ENTER && _page == HomePage::DISPLAY) {
            char reply[80] = {};
            if (!board.handleCommand("set display off", 0, reply) || strncmp(reply, "OK", 2) != 0) {
              _task->showAlert("Display error", 800);
            }
            return true;
          }
          ''' + anchor
              if anchor not in ui:
                  raise SystemExit('Display input anchor not found')
              ui = ui.replace(anchor, block, 1)

          ui_path.write_text(ui)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          if '### Local OLED control' not in readme:
              anchor = '\n## Building\n'
              section = '''
### Local OLED control

On Companion OLED firmware, use short PRG presses to cycle to the **Display** page. While that page is visible, hold PRG for about one second to disable the OLED persistently. This is performed entirely on the node and does not require a phone CLI or a computer.

While persistently disabled, incoming messages and ordinary button presses do not wake the OLED. Hold PRG for about one second while the screen is off to restore it. Bluetooth and LoRa remain active throughout.
'''
              if anchor not in readme:
                  raise SystemExit('README build anchor not found')
              readme = readme.replace(anchor, '\n' + section + anchor, 1)
              readme_path.write_text(readme)

          ci_path = Path('.github/workflows/heltec-v4-ci.yml')
          ci = ci_path.read_text()
          if "grep -q '^    DISPLAY,$'" not in ci:
              anchor = '          done\n\n  unit-tests:'
              checks = '''          done

          grep -q '^    DISPLAY,$' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'HomePage::DISPLAY' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'board.handleCommand("set display off"' examples/companion_radio/ui-new/UITask.cpp

  unit-tests:'''
              if anchor not in ci:
                  raise SystemExit('CI audit anchor not found')
              ci = ci.replace(anchor, checks, 1)
              ci_path.write_text(ci)

          Path('docs/HELTEC_V4_LOCAL_DISPLAY_AUDIT.md').write_text('''# Heltec V4 local OLED control audit

## Implemented interaction

1. From the Companion home screen, short PRG presses advance through the physical pages.
2. The new **Display** page shows `OLED ON` and the long-press instruction.
3. Holding PRG for approximately one second on that page invokes the board's existing persistent `set display off` path.
4. The persistent display policy prevents incoming messages and ordinary button events from waking the OLED.
5. Holding PRG for approximately one second while the display is off is intercepted by the existing platform restore hook; the event is consumed so the restored display is not immediately disabled again.

## Isolation

The change is limited to the Companion UI and documentation. It does not modify BLE advertising, BLE security, LoRa routing, RF power mapping, GPS policy, battery thresholds, identity persistence, or Solar Repeater recovery.

## Validation gate

The audit workflow runs native tests and compiles all three Companion targets: BLE, USB, and Wi-Fi. Repository CI also retains static checks for the Display page and its persistent-off action.
''')
          PY

      - name: Verify source-level behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^    DISPLAY,$' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'HomePage::DISPLAY' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'board.handleCommand("set display off"' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'Local OLED control' README.md

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Run native tests
        run: pio test -e native -e native_kiss_modem -vv

      - name: Compile Companion BLE, USB and Wi-Fi
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            heltec_v4_companion_radio_ble \
            heltec_v4_companion_radio_usb \
            heltec_v4_companion_radio_wifi
          do
            pio run -e "${target}"
            pio run -e "${target}" -t mergebin
          done

      - name: Commit audited source and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/guarantee-local-display-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes were required after audit.'
          else
            git commit -m 'fix(companion): guarantee local persistent OLED control'
            git push origin HEAD:fix/heltec-v4-local-display-guarantee
          fi

      - name: Merge audited pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head fix/heltec-v4-local-display-guarantee --base main --state open --json number --jq '.[0].number')"
          test -n "${pr_number}"
          gh pr merge "${pr_number}" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch \
            --subject 'fix(companion): guarantee local persistent OLED control' \
            --body 'Audit and enforce the physical Display page, persistent OLED-off action, and long-press restoration path for Heltec V4 Companion firmware. Native tests and BLE/USB/Wi-Fi Companion builds passed.'
