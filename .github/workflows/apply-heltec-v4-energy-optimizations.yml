name: Heltec V4 Energy Branch Validation

on:
  push:
    branches:
      - feature/heltec-v4-energy-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heltec-v4-energy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-environment
      - run: pio test -e native -e native_kiss_modem -vv

  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment:
          - heltec_v4_repeater
          - heltec_v4_solar_repeater
          - heltec_v4_solar_repeater_headless
          - heltec_v4_expansionkit_repeater
          - heltec_v4_repeater_bridge_espnow
          - heltec_v4_repeater_bridge_espnow_low_power
          - heltec_v4_room_server
          - heltec_v4_terminal_chat
          - heltec_v4_companion_radio_usb
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_ble_low_power
          - heltec_v4_companion_radio_wifi
          - heltec_v4_companion_radio_wifi_low_power
          - heltec_v4_sensor
          - heltec_v4_sensor_low_power
          - heltec_v4_kiss_modem
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-environment
      - name: Build application and complete image
        shell: bash
        env:
          TARGET: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          pio run -e "${TARGET}"
          pio run -e "${TARGET}" -t mergebin
          test -s ".pio/build/${TARGET}/firmware.bin"
          test -s ".pio/build/${TARGET}/firmware-merged.bin"
