name: Apply Heltec V4 on-device OLED control

on:
  push:
    branches:
      - feature/heltec-v4-on-device-display-control
    paths:
      - .github/workflows/apply-heltec-v4-display-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Apply focused UI and documentation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          ui = "examples/companion_radio/ui-new/UITask.cpp"

          replace_once(
              ui,
              "    BLUETOOTH,\n    ADVERT,",
              "    BLUETOOTH,\n    DISPLAY,\n    ADVERT,",
          )

          replace_once(
              ui,
              "  uint8_t _page;\n  bool _shutdown_init;",
              "  uint8_t _page;\n  bool _display_off_init;\n  bool _shutdown_init;",
          )

          replace_once(
              ui,
              "     : _task(task), _rtc(rtc), _sensors(sensors), _node_prefs(node_prefs), _page(0),\n       _shutdown_init(false), sensors_lpp(200) {  }",
              "     : _task(task), _rtc(rtc), _sensors(sensors), _node_prefs(node_prefs), _page(0),\n       _display_off_init(false), _shutdown_init(false), sensors_lpp(200) {  }",
          )

          replace_once(
              ui,
              "  void poll() override {\n    if (_shutdown_init && !_task->isButtonPressed()) {  // must wait for USR button to be released\n      _task->shutdown();\n    }\n  }",
              "  void poll() override {\n    if (_display_off_init && !_task->isButtonPressed()) {\n      _display_off_init = false;\n      if (!heltecV4SetDisplayEnabled(false)) {\n        _task->showAlert(\"Display control failed\", 1000);\n      }\n    }\n    if (_shutdown_init && !_task->isButtonPressed()) {  // must wait for USR button to be released\n      _task->shutdown();\n    }\n  }",
          )

          replace_once(
              ui,
              "      display.drawTextCentered(display.width() / 2, 64 - 11, \"toggle: \" PRESS_LABEL);\n    } else if (_page == HomePage::ADVERT) {",
              "      display.drawTextCentered(display.width() / 2, 64 - 11, \"toggle: \" PRESS_LABEL);\n    } else if (_page == HomePage::DISPLAY) {\n      display.setColor(UIColor::primary_txt);\n      display.setTextSize(2);\n      display.drawTextCentered(display.width() / 2, 22, \"OLED: ON\");\n      display.setColor(_display_off_init ? UIColor::warning_txt : UIColor::secondary_txt);\n      display.setTextSize(1);\n      display.drawTextCentered(display.width() / 2, 43,\n          _display_off_init ? \"release: turn off\" : \"turn off: long press\");\n      display.setColor(UIColor::secondary_txt);\n      display.drawTextCentered(display.width() / 2, 54, \"restore: long press\");\n    } else if (_page == HomePage::ADVERT) {",
          )

          replace_once(
              ui,
              "    if (c == KEY_ENTER && _page == HomePage::ADVERT) {",
              "    if (c == KEY_ENTER && _page == HomePage::DISPLAY) {\n      if (heltecV4GetDisplayDisabled() < 0) {\n        _task->showAlert(\"Display unsupported\", 1000);\n      } else {\n        _display_off_init = true;\n        _task->showAlert(\"Release to turn off\", 800);\n      }\n      return true;\n    }\n    if (c == KEY_ENTER && _page == HomePage::ADVERT) {",
          )

          replace_once(
              ui,
              "void UITask::loop() {\n  char c = 0;",
              "void UITask::loop() {\n  // A persistent-display restore is handled at the button layer before a UI\n  // key event is emitted. Detect the off-to-on transition here so the restored\n  // OLED receives a fresh frame and a full auto-off interval.\n  static bool display_was_on = false;\n  if (_display != NULL) {\n    const bool display_is_on = _display->isOn();\n    if (display_is_on && !display_was_on) {\n      _auto_off = millis() + AUTO_OFF_MILLIS;\n      _next_refresh = 0;\n    }\n    display_was_on = display_is_on;\n  }\n\n  char c = 0;",
          )

          replace_once(
              "variants/heltec_v4/target.h",
              "#ifdef DISPLAY_CLASS\n  extern DISPLAY_CLASS display;\n  extern MomentaryButton user_btn;\n#endif\n\nbool radio_init();",
              "#ifdef DISPLAY_CLASS\n  extern DISPLAY_CLASS display;\n  extern MomentaryButton user_btn;\n\n  // Persistent OLED control shared by the local UI and the board CLI.\n  bool heltecV4SetDisplayEnabled(bool enabled);\n  int8_t heltecV4GetDisplayDisabled();\n#endif\n\nbool radio_init();",
          )

          replace_once(
              "README.md",
              "`get power.status` reports raw millivolts, the filtered percentage and the active Standard/Solar profile. `get radio.power` reports requested SX1262 input, the value actually applied after the FEM limit, and estimated antenna output. After `set display off`, messages and ordinary button presses do not wake the OLED; hold PRG for about one second to restore it.\n\n## Building",
              "`get power.status` reports raw millivolts, the filtered percentage and the active Standard/Solar profile. `get radio.power` reports requested SX1262 input, the value actually applied after the FEM limit, and estimated antenna output. After `set display off`, messages and ordinary button presses do not wake the OLED; hold PRG for about one second to restore it.\n\n### On-device OLED control\n\nThe Heltec V4 Companion no longer requires a computer or a client-side CLI to disable the screen persistently:\n\n1. Short-press PRG to move through the home pages until `OLED: ON` appears.\n2. Hold PRG for about one second.\n3. Release PRG when the screen requests it; the OLED and its rail turn off and the preference is saved.\n4. To restore the OLED at any time, hold PRG again for about one second.\n\nTurning off the OLED does not disable Bluetooth or LoRa. Incoming messages continue to be received without waking the screen. The restored display receives a new auto-off interval instead of switching off immediately.\n\n## Building",
          )

          replace_once(
              ".github/workflows/heltec-v4-ci.yml",
              "          for source in \"${application_loops[@]}\"; do\n            test \"$(grep -Ec '^  board\\.loop\\(\\);$' \"${source}\")\" -eq 1\n          done\n",
              "          for source in \"${application_loops[@]}\"; do\n            test \"$(grep -Ec '^  board\\.loop\\(\\);$' \"${source}\")\" -eq 1\n          done\n\n          ui_source=examples/companion_radio/ui-new/UITask.cpp\n          grep -q '^    DISPLAY,$' \"${ui_source}\"\n          grep -q 'HomePage::DISPLAY' \"${ui_source}\"\n          grep -q 'heltecV4SetDisplayEnabled(false)' \"${ui_source}\"\n          grep -q 'restore: long press' \"${ui_source}\"\n          grep -q 'bool heltecV4SetDisplayEnabled(bool enabled);' variants/heltec_v4/target.h\n",
          )
          PY

      - name: Check patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^    DISPLAY,$' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'release: turn off' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'heltecV4SetDisplayEnabled(false)' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'display_is_on && !display_was_on' examples/companion_radio/ui-new/UITask.cpp

      - name: Commit focused patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/ui-new/UITask.cpp variants/heltec_v4/target.h README.md .github/workflows/heltec-v4-ci.yml
          git commit -m "feat(heltec-v4): add on-device persistent OLED control"
          git push
