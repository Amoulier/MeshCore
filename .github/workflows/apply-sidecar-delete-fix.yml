name: Apply reviewed sidecar deletion fix

on:
  push:
    branches:
      - feature/heltec-v4-power-parity
    paths:
      - .github/workflows/apply-sidecar-delete-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/heltec-v4-power-parity
          fetch-depth: 0

      - name: Patch DataStore and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/companion_radio/DataStore.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''bool DataStore::removeFile(const char* filename) {
            return meshcorePersistentWritesAllowed() && _fs->remove(filename);
          }

          bool DataStore::removeFile(FILESYSTEM* fs, const char* filename) {
            return meshcorePersistentWritesAllowed() && fs->remove(filename);
          }
          '''
          new = '''static bool removeFileAndSidecars(FILESYSTEM* fs, const char* filename) {
            if (!meshcorePersistentWritesAllowed()) {
              return false;
            }

            char temporary_filename[96];
            char backup_filename[96];
            makeSidecarPath(temporary_filename, sizeof(temporary_filename), filename, ".tmp");
            makeSidecarPath(backup_filename, sizeof(backup_filename), filename, ".bak");

            // Remove recovery copies first. If either removal fails, keep the
            // primary intact rather than report a deletion that can resurrect.
            if (fs->exists(temporary_filename) && !fs->remove(temporary_filename)) {
              return false;
            }
            if (fs->exists(backup_filename) && !fs->remove(backup_filename)) {
              return false;
            }
            return fs->remove(filename);
          }

          bool DataStore::removeFile(const char* filename) {
            return removeFileAndSidecars(_fs, filename);
          }

          bool DataStore::removeFile(FILESYSTEM* fs, const char* filename) {
            return removeFileAndSidecars(fs, filename);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected DataStore::removeFile block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm .github/workflows/apply-sidecar-delete-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/DataStore.cpp .github/workflows/apply-sidecar-delete-fix.yml
          git commit -m "fix(storage): remove recovery sidecars with primary files"
          git push origin HEAD:feature/heltec-v4-power-parity
