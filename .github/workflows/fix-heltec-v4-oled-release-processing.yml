name: Fix Heltec V4 OLED release processing

on:
  push:
    branches:
      - feature/heltec-v4-on-device-display-control
    paths:
      - .github/workflows/fix-heltec-v4-oled-release-processing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Process an armed OLED shutdown independently of the active screen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/companion_radio/ui-new/UITask.cpp")
          text = path.read_text(encoding="utf-8")

          old_poll = "  void poll() override {\n    if (_display_off_init && !_task->isButtonPressed()) {\n      _display_off_init = false;\n      if (!heltecV4SetDisplayEnabled(false)) {\n        _task->showAlert(\"Display control failed\", 1000);\n      }\n    }\n    if (_shutdown_init && !_task->isButtonPressed()) {  // must wait for USR button to be released\n      _task->shutdown();\n    }\n  }"

          new_poll = "  void processDisplayOffRelease() {\n    if (_display_off_init && !_task->isButtonPressed()) {\n      _display_off_init = false;\n      if (!heltecV4SetDisplayEnabled(false)) {\n        _task->showAlert(\"Display control failed\", 1000);\n      }\n    }\n  }\n\n  void poll() override {\n    if (_shutdown_init && !_task->isButtonPressed()) {  // must wait for USR button to be released\n      _task->shutdown();\n    }\n  }"

          old_loop = "  if (curr) curr->poll();\n\n  // Persistent restore happens inside the button layer and emits no UI key."
          new_loop = "  // Complete an armed OLED shutdown even if a message preview or another\n  // temporary screen became active before PRG was released. This prevents the\n  // action from remaining latent and firing later on return to the home page.\n  if (home != NULL) {\n    static_cast<HomeScreen *>(home)->processDisplayOffRelease();\n  }\n\n  if (curr) curr->poll();\n\n  // Persistent restore happens inside the button layer and emits no UI key."

          if new_poll not in text:
              if text.count(old_poll) != 1:
                  raise RuntimeError(f"Expected one HomeScreen poll block, found {text.count(old_poll)}")
              text = text.replace(old_poll, new_poll, 1)

          if new_loop not in text:
              if text.count(old_loop) != 1:
                  raise RuntimeError(f"Expected one UITask loop anchor, found {text.count(old_loop)}")
              text = text.replace(old_loop, new_loop, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'void processDisplayOffRelease()' examples/companion_radio/ui-new/UITask.cpp)" -eq 1
          test "$(grep -c 'processDisplayOffRelease();' examples/companion_radio/ui-new/UITask.cpp)" -eq 1
          grep -q 'action from remaining latent' examples/companion_radio/ui-new/UITask.cpp
          python - <<'PY'
          from pathlib import Path
          text = Path("examples/companion_radio/ui-new/UITask.cpp").read_text(encoding="utf-8")
          release_pos = text.index("processDisplayOffRelease();")
          curr_poll_pos = text.index("if (curr) curr->poll();")
          assert release_pos < curr_poll_pos
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/ui-new/UITask.cpp
          git commit -m "fix(heltec-v4): process OLED release outside active screen"
          git push