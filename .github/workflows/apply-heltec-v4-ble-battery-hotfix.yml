name: Apply Heltec V4 BLE Battery Hotfix

on:
  push:
    branches:
      - fix/heltec-v4-ble-battery-drain
    paths:
      - .github/workflows/apply-heltec-v4-ble-battery-hotfix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/heltec-v4-ble-battery-drain
          fetch-depth: 0

      - name: Apply battery hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")

          # Track whether the old Arduino BLE stack has been fully deinitialized.
          replace_exact(
              "src/helpers/esp32/SerialBLEInterface.h",
              "  bool idle_connection_profile;\n  uint8_t peer_address[ESP_BD_ADDR_LEN];",
              "  bool idle_connection_profile;\n  bool stack_deinitialized;\n  uint8_t peer_address[ESP_BD_ADDR_LEN];",
          )
          replace_exact(
              "src/helpers/esp32/SerialBLEInterface.h",
              "    idle_connection_profile = false;\n    _isEnabled = false;",
              "    idle_connection_profile = false;\n    stack_deinitialized = false;\n    _isEnabled = false;",
          )

          # Keep standard BLE discoverable, but use a much slower long-term
          # advertising cadence. The low-power target additionally shuts the
          # controller down completely after its disconnected timeout.
          replace_exact(
              "src/helpers/esp32/SerialBLEInterface.cpp",
              "#include \"esp_mac.h\"\n#include <esp_gap_ble_api.h>",
              "#include \"esp_mac.h\"\n#include <esp_gap_ble_api.h>\n#include <esp_system.h>",
          )
          replace_exact(
              "src/helpers/esp32/SerialBLEInterface.cpp",
              "#define BLE_SLOW_ADV_MIN 800\n#define BLE_SLOW_ADV_MAX 1600",
              "#ifndef HELTEC_V4_BLE_SLOW_ADV_MIN\n#define HELTEC_V4_BLE_SLOW_ADV_MIN 3200\n#endif\n#ifndef HELTEC_V4_BLE_SLOW_ADV_MAX\n#define HELTEC_V4_BLE_SLOW_ADV_MAX 4800\n#endif\n#define BLE_SLOW_ADV_MIN HELTEC_V4_BLE_SLOW_ADV_MIN\n#define BLE_SLOW_ADV_MAX HELTEC_V4_BLE_SLOW_ADV_MAX",
          )
          replace_exact(
              "src/helpers/esp32/SerialBLEInterface.cpp",
              "void SerialBLEInterface::enable()\n{\n  if (_isEnabled) return;\n  _isEnabled = true;",
              "void SerialBLEInterface::enable()\n{\n  if (_isEnabled) return;\n#if defined(HELTEC_V4_BLE_FULL_SHUTDOWN) && HELTEC_V4_BLE_FULL_SHUTDOWN\n  // Arduino-ESP32 2.x cannot safely recreate the GATT server after a full\n  // BLEDevice::deinit(). Rebooting is deterministic and preserves all flash\n  // identity/configuration while restoring the complete BLE stack.\n  if (stack_deinitialized) {\n    delay(20);\n    esp_restart();\n    return;\n  }\n#endif\n  _isEnabled = true;",
          )

          ble_cpp = Path("src/helpers/esp32/SerialBLEInterface.cpp")
          text = ble_cpp.read_text(encoding="utf-8")
          old_disable = '''void SerialBLEInterface::disable()\n{\n  _isEnabled = false;\n  BLE_DEBUG_PRINTLN("SerialBLEInterface::disable");\n  pServer->getAdvertising()->stop();\n  if (pServer->getConnectedCount() > 0) pServer->disconnect(last_conn_id);\n  pService->stop();\n  oldDeviceConnected = deviceConnected = false;\n  peer_address_valid = false;\n  connection_profile_known = false;\n  disconnected_since = 0;\n  adv_restart_time = fast_adv_until = 0;\n}\n'''
          new_disable = '''void SerialBLEInterface::disable()\n{\n  _isEnabled = false;\n  BLE_DEBUG_PRINTLN("SerialBLEInterface::disable");\n  if (pServer != NULL) {\n    pServer->getAdvertising()->stop();\n    if (pServer->getConnectedCount() > 0) {\n      pServer->disconnect(last_conn_id);\n      delay(50);\n    }\n  }\n  if (pService != NULL) pService->stop();\n  clearBuffers();\n  oldDeviceConnected = deviceConnected = false;\n  peer_address_valid = false;\n  connection_profile_known = false;\n  disconnected_since = 0;\n  adv_restart_time = fast_adv_until = 0;\n\n#if defined(HELTEC_V4_BLE_FULL_SHUTDOWN) && HELTEC_V4_BLE_FULL_SHUTDOWN\n  // Stopping advertising alone leaves Bluedroid and the controller powered.\n  // Fully deinitialize them in the explicit low-power build. Re-enabling BLE\n  // performs a clean reboot because Arduino-ESP32 2.x retains stale GATT\n  // singleton objects after deinit(false).\n  BLEDevice::deinit(false);\n  pServer = NULL;\n  pService = NULL;\n  pTxCharacteristic = NULL;\n  stack_deinitialized = true;\n#endif\n}\n'''
          if old_disable not in text:
              raise SystemExit("expected SerialBLEInterface::disable implementation not found")
          ble_cpp.write_text(text.replace(old_disable, new_disable, 1), encoding="utf-8")

          # When BLE is fully off, sleep the ESP32-S3 while the SX1262 remains
          # in continuous receive. DIO1 wakes immediately for a LoRa packet and
          # the timer services scheduled tasks.
          replace_exact(
              "examples/companion_radio/main.cpp",
              "  board.idle();\n}",
              "#if defined(ESP32) && defined(BLE_PIN_CODE) && \\\n    defined(HELTEC_V4_BLE_SLEEP_WHEN_OFF) && HELTEC_V4_BLE_SLEEP_WHEN_OFF\n  if (!bluetooth_interface.isEnabled() && !the_mesh.hasPendingWork()) {\n#ifndef HELTEC_V4_BLE_SLEEP_SECS\n#define HELTEC_V4_BLE_SLEEP_SECS 30\n#endif\n    board.sleep(HELTEC_V4_BLE_SLEEP_SECS);\n    return;\n  }\n#endif\n  board.idle();\n}",
          )

          # Make PRG an immediate light-sleep wake source, in addition to LoRa
          # DIO1 and the maintenance timer.
          board_h = Path("src/helpers/ESP32Board.h")
          text = board_h.read_text(encoding="utf-8")
          pattern = re.compile(r"  void sleep\(uint32_t secs\) override \{.*?\n  \}\n\n  uint8_t getStartupReason", re.S)
          replacement = '''  void sleep(uint32_t secs) override {\n    // Skip if not allowed to sleep.\n    if (inhibit_sleep) {\n      delay(1);\n      return;\n    }\n\n    const gpio_num_t loraWakeupPin = (gpio_num_t)getIRQGpio();\n#ifdef PIN_USER_BTN\n    const gpio_num_t buttonWakeupPin = (gpio_num_t)PIN_USER_BTN;\n#endif\n\n    if (secs > 0) {\n      esp_sleep_enable_timer_wakeup((uint64_t)secs * 1000000ULL);\n    } else {\n      esp_sleep_disable_wakeup_source(ESP_SLEEP_WAKEUP_TIMER);\n    }\n\n    portENTER_CRITICAL(&sleepMux);\n\n    bool wakeAlreadyAsserted = gpio_get_level(loraWakeupPin) == HIGH;\n#ifdef PIN_USER_BTN\n    wakeAlreadyAsserted = wakeAlreadyAsserted ||\n                          gpio_get_level(buttonWakeupPin) == USER_BTN_PRESSED;\n#endif\n    if (wakeAlreadyAsserted) {\n      portEXIT_CRITICAL(&sleepMux);\n      delay(1);\n      return;\n    }\n\n    esp_sleep_enable_gpio_wakeup();\n    gpio_wakeup_enable(loraWakeupPin, GPIO_INTR_HIGH_LEVEL);\n#ifdef PIN_USER_BTN\n    gpio_wakeup_enable(\n        buttonWakeupPin,\n        USER_BTN_PRESSED == LOW ? GPIO_INTR_LOW_LEVEL : GPIO_INTR_HIGH_LEVEL);\n#endif\n\n    esp_light_sleep_start();\n\n    gpio_wakeup_disable(loraWakeupPin);\n#ifdef PIN_USER_BTN\n    gpio_wakeup_disable(buttonWakeupPin);\n#endif\n    gpio_set_intr_type(loraWakeupPin, GPIO_INTR_POSEDGE);\n\n    portEXIT_CRITICAL(&sleepMux);\n  }\n\n  uint8_t getStartupReason'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("ESP32Board::sleep implementation not found exactly once")
          board_h.write_text(text2, encoding="utf-8")

          # Make the low-power BLE target genuinely low-power without changing
          # LoRa TX power. Its fresh-install RX default becomes balanced
          # (normal SX1262 RX, external KCT8103L LNA retained).
          replace_exact(
              "variants/heltec_v4/platformio.ini",
              "[env:heltec_v4_companion_radio_ble_low_power]\nextends = env:heltec_v4_companion_radio_ble\nbuild_flags =\n  ${env:heltec_v4_companion_radio_ble.build_flags}\n  -D HELTEC_V4_BLE_AUTO_OFF_MSEC=300000",
              "[env:heltec_v4_companion_radio_ble_low_power]\nextends = env:heltec_v4_companion_radio_ble\nbuild_unflags =\n  -D SX126X_RX_BOOSTED_GAIN=1\nbuild_flags =\n  ${env:heltec_v4_companion_radio_ble.build_flags}\n  -D SX126X_RX_BOOSTED_GAIN=0\n  -D HELTEC_V4_BLE_AUTO_OFF_MSEC=300000\n  -D HELTEC_V4_BLE_FULL_SHUTDOWN=1\n  -D HELTEC_V4_BLE_SLEEP_WHEN_OFF=1\n  -D HELTEC_V4_BLE_SLEEP_SECS=30",
          )

          # Keep user-facing documentation honest about the behavioral tradeoff.
          replace_exact(
              "README.md",
              "| `heltec_v4_companion_radio_ble_low_power` | BLE Companion that turns Bluetooth off after five disconnected minutes |",
              "| `heltec_v4_companion_radio_ble_low_power` | BLE Companion that fully powers Bluetooth down after five disconnected minutes, then light-sleeps between LoRa/timer/button wakes |",
          )
          replace_exact(
              "README.md",
              "- The BLE low-power target disables Bluetooth after five minutes without a connection. LoRa continues running. Restore Bluetooth locally from the Bluetooth page with a long PRG press.",
              "- The BLE low-power target fully deinitializes Bluetooth after five minutes without a connection, then light-sleeps the ESP32-S3 while LoRa remains in receive. A long PRG press on the Bluetooth page reboots cleanly to restore BLE; identity and saved configuration are preserved.",
          )
          replace_exact(
              "docs/HELTEC_V4_ENERGY_OPTIMIZATION.md",
              "then disables Bluetooth completely after five minutes without a connection.\nLoRa and the node continue operating. Restore Bluetooth locally from the\nBluetooth page on the Heltec display with a long PRG press.",
              "then fully deinitializes Bluedroid and the Bluetooth controller after five\nminutes without a connection. The ESP32-S3 then enters 30-second light-sleep\nwindows, waking immediately for LoRa DIO1 or PRG and periodically for scheduled\nwork. LoRa and the node continue operating. Restoring Bluetooth locally from\nthe Bluetooth page performs a clean reboot because the pinned Arduino-ESP32\n2.x BLE library cannot safely recreate its retained GATT singletons in place.",
          )
          replace_exact(
              ".github/workflows/heltec-v4-validation-release.yml",
              "- `heltec_v4_companion_radio_ble_low_power` — BLE Companion that turns Bluetooth off after five disconnected minutes; restore it locally with PRG.",
              "- `heltec_v4_companion_radio_ble_low_power` — BLE Companion that fully powers Bluetooth down after five disconnected minutes and light-sleeps between LoRa/timer/button wakes; PRG restores BLE through a clean reboot.",
          )

          # Assertions guard the exact intended behavior.
          checks = {
              "src/helpers/esp32/SerialBLEInterface.cpp": [
                  "BLEDevice::deinit(false)",
                  "HELTEC_V4_BLE_SLOW_ADV_MIN 3200",
                  "esp_restart()",
              ],
              "examples/companion_radio/main.cpp": [
                  "board.sleep(HELTEC_V4_BLE_SLEEP_SECS)",
              ],
              "src/helpers/ESP32Board.h": [
                  "buttonWakeupPin",
                  "GPIO_INTR_LOW_LEVEL",
              ],
              "variants/heltec_v4/platformio.ini": [
                  "HELTEC_V4_BLE_FULL_SHUTDOWN=1",
                  "SX126X_RX_BOOSTED_GAIN=0",
              ],
          }
          for path, needles in checks.items():
              content = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"missing {needle!r} in {path}")
          PY

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Run native policy tests
        run: pio test -e native

      - name: Build standard and low-power BLE Companions
        shell: bash
        run: |
          set -euo pipefail
          pio run -e heltec_v4_companion_radio_ble
          pio run -e heltec_v4_companion_radio_ble_low_power
          pio run -e heltec_v4_companion_radio_ble -t mergebin
          pio run -e heltec_v4_companion_radio_ble_low_power -t mergebin
          test -s .pio/build/heltec_v4_companion_radio_ble/firmware.bin
          test -s .pio/build/heltec_v4_companion_radio_ble/firmware-merged.bin
          test -s .pio/build/heltec_v4_companion_radio_ble_low_power/firmware.bin
          test -s .pio/build/heltec_v4_companion_radio_ble_low_power/firmware-merged.bin

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-heltec-v4-ble-battery-hotfix.yml
          git diff --check
          git config user.name "Amoulier"
          git config user.email "Amoulier@gmail.com"
          git add -A
          git commit -m "fix(heltec-v4): cut BLE-off Companion battery drain"
          git push origin HEAD:fix/heltec-v4-ble-battery-drain
