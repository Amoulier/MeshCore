name: Fix Heltec V4 OLED enum collision

on:
  push:
    branches:
      - feature/heltec-v4-on-device-display-control
    paths:
      - .github/workflows/fix-heltec-v4-oled-enum.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Rename enum value that collides with Arduino DISPLAY macro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("examples/companion_radio/ui-new/UITask.cpp")
          text = path.read_text(encoding="utf-8")
          if "HomePage::OLED_CONTROL" not in text:
              if text.count("    DISPLAY,\n") != 1:
                  raise RuntimeError(f"DISPLAY enum count: {text.count('    DISPLAY,')}")
              if text.count("HomePage::DISPLAY") != 4:
                  raise RuntimeError(f"HomePage::DISPLAY reference count: {text.count('HomePage::DISPLAY')}")
              text = text.replace("    DISPLAY,\n", "    OLED_CONTROL,\n", 1)
              text = text.replace("HomePage::DISPLAY", "HomePage::OLED_CONTROL")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -Ec '^    OLED_CONTROL,$' examples/companion_radio/ui-new/UITask.cpp)" -eq 1
          test "$(grep -c 'HomePage::OLED_CONTROL' examples/companion_radio/ui-new/UITask.cpp)" -eq 4
          test "$(grep -c 'HomePage::DISPLAY' examples/companion_radio/ui-new/UITask.cpp || true)" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/companion_radio/ui-new/UITask.cpp
          git commit -m "fix(heltec-v4): avoid Arduino DISPLAY macro collision"
          git push
