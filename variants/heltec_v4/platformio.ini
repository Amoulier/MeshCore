; Heltec WiFi LoRa 32 V4 OLED-only firmware targets.
; TFT and R8 targets are intentionally excluded from this distribution.

[Heltec_lora32_v4]
extends = esp32_base
board = heltec_v4
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_v4
  -D HELTEC_LORA_V4
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D HELTEC_V4_DISABLE_TX_LED=1
  -D HELTEC_V4_SKIP_GPS_STARTUP_PROBE=1
  -D HELTEC_V4_BATTERY_CACHE_MSEC=10000
  -D HELTEC_V4_TX_PA_SETTLE_US=20
  -D NOISE_FLOOR_CALIB_FAST_INTERVAL=2000
  -D NOISE_FLOOR_CALIB_STABLE_INTERVAL=30000
  -D NOISE_FLOOR_CALIB_FAST_DURATION=60000
  -D DEFAULT_FEM_RX_GAIN=1
  -D ADC_MULTIPLIER=5.1205f
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7
  -D P_LORA_GC1109_PA_EN=2
  -D P_LORA_GC1109_PA_TX_EN=46
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=LOW
  -D LORA_TX_POWER=11
  -D LORA_RADIO_BOOT_POWER=0
  -D MAX_LORA_TX_POWER=22
  -D SX126X_REGISTER_PATCH=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D PIN_GPS_RESET=42
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_EN=34
  -D PIN_GPS_EN_ACTIVE=LOW
  -D ENV_INCLUDE_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v4>
  +<helpers/sensors>
  +<helpers/PersistentWriteGuard.cpp>
lib_deps =
  ${esp32_base.lib_deps}

[heltec_v4_sensor_drivers]
build_flags =
  ${sensor_base.build_flags}
  -D ENV_HAS_I2C_SENSORS=1
lib_deps =
  ${sensor_base.lib_deps}

[heltec_v4_oled]
extends = Heltec_lora32_v4
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_OLED
  -D HELTEC_V4_PERSISTENT_DISPLAY=1
  -D HELTEC_V4_DISPLAY_DEFAULT_OFF=0
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
lib_deps = ${Heltec_lora32_v4.lib_deps}

[heltec_v4_repeater_common]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D HELTEC_V4_ENABLE_DFS=1
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D DEFAULT_ADVERT_INTERVAL=8
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_v4_repeater]
extends = heltec_v4_repeater_common

[env:heltec_v4_solar_repeater]
extends = heltec_v4_repeater_common
build_unflags =
  -D HELTEC_V4_DISPLAY_DEFAULT_OFF=0
  -D DEFAULT_ADVERT_INTERVAL=8
  -DBOARD_HAS_PSRAM
build_flags =
  ${heltec_v4_repeater_common.build_flags}
  -D HELTEC_V4_SOLAR_PROFILE=1
  -D HELTEC_V4_DISPLAY_DEFAULT_OFF=1
  -D DEFAULT_ADVERT_INTERVAL=15
  -D DEFAULT_POWERSAVING_ENABLED=1
  -D POWERSAVING_FIRSTSLEEP_SECS=30

[env:heltec_v4_solar_repeater_headless]
extends = heltec_v4_solar_repeater
build_unflags =
  ${heltec_v4_solar_repeater.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_flags =
  ${heltec_v4_solar_repeater.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -D HELTEC_V4_HEADLESS=1

[env:heltec_v4_expansionkit_repeater]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  ${heltec_v4_sensor_drivers.build_flags}
  -D HELTEC_V4_ENABLE_EXTERNAL_RTC_PROBE=1
  -D HELTEC_V4_ENABLE_DFS=1
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D DEFAULT_ADVERT_INTERVAL=8
  -D HELTEC_V4_KEEP_ACCESSORY_RAIL_ON=1
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D ENV_PIN_SDA=4
  -D ENV_PIN_SCL=3
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${heltec_v4_sensor_drivers.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_v4_repeater_bridge_espnow]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D HELTEC_V4_ENABLE_DFS=1
  -D DEFAULT_ADVERT_INTERVAL=8
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_v4_repeater_bridge_espnow_low_power]
extends = heltec_v4_repeater_bridge_espnow
build_flags =
  ${heltec_v4_repeater_bridge_espnow.build_flags}
  -D HELTEC_V4_ESPNOW_LOW_POWER=1
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D HELTEC_V4_ESPNOW_WAKE_WINDOW_MS=20
  -D HELTEC_V4_ESPNOW_WAKE_INTERVAL_MS=100

[env:heltec_v4_room_server]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D HELTEC_V4_ENABLE_DFS=1
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D DEFAULT_ADVERT_INTERVAL=8
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_v4_terminal_chat]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:heltec_v4_companion_radio_usb]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D ENABLE_USB_INTERFACE
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:heltec_v4_companion_radio_ble]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D HELTEC_V4_ENABLE_DFS=1
  -D HELTEC_V4_BLE_POWER_SAVE=1
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:heltec_v4_companion_radio_ble_low_power]
extends = heltec_v4_companion_radio_ble
build_flags =
  ${heltec_v4_companion_radio_ble.build_flags}
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1

[env:heltec_v4_companion_radio_wifi]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D HELTEC_V4_ENABLE_DFS=1
  -D HELTEC_V4_WIFI_POWER_SAVE=1
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:heltec_v4_companion_radio_wifi_low_power]
extends = heltec_v4_companion_radio_wifi
build_flags =
  ${heltec_v4_companion_radio_wifi.build_flags}
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D HELTEC_V4_WIFI_AGGRESSIVE_BACKOFF=1

[env:heltec_v4_sensor]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  ${heltec_v4_sensor_drivers.build_flags}
  -D HELTEC_V4_ENABLE_EXTERNAL_RTC_PROBE=1
  -D HELTEC_V4_ENABLE_DFS=1
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D DEFAULT_ADVERT_INTERVAL=8
  -D HELTEC_V4_KEEP_ACCESSORY_RAIL_ON=1
  -D ADVERT_NAME='"Heltec v4 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=3
  -D ENV_PIN_SCL=4
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_sensor>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${heltec_v4_sensor_drivers.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_v4_sensor_low_power]
extends = heltec_v4_sensor
build_unflags =
  -D HELTEC_V4_KEEP_ACCESSORY_RAIL_ON=1
  -D HELTEC_V4_DISPLAY_DEFAULT_OFF=0
  -D HELTEC_V4_AUTO_LIGHT_SLEEP=1
  -D DEFAULT_ADVERT_INTERVAL=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -DBOARD_HAS_PSRAM
build_flags =
  ${heltec_v4_sensor.build_flags}
  -D HELTEC_V4_SENSOR_LOW_POWER=1
  -D HELTEC_V4_DISPLAY_DEFAULT_OFF=1
  -D DEFAULT_ADVERT_INTERVAL=0
  -D ENABLE_ADVERT_ON_BOOT=0
  -D SENSOR_READ_INTERVAL_SECS=1
  -D HELTEC_V4_SENSOR_SLEEP_SECS=900
  -D HELTEC_V4_SENSOR_AWAKE_MSEC=12000

[env:heltec_v4_kiss_modem]
extends = Heltec_lora32_v4
build_unflags =
  -DARDUINO_USB_MODE=0
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -DARDUINO_USB_MODE=1
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
  +<../examples/kiss_modem/>
